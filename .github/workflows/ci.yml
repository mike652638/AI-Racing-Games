# 持续集成：typecheck → lint → format:check → test → bot → build → e2e 视觉回归
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # 2026-09-04：模块级测试可达性门禁（零依赖静态分析）。
      # 此前 CI 完全没有覆盖率度量，新增模块可能在无人察觉下零测试（如 applyRuntimeParams
      # 热切路径、pwa-update 提示条均由此暴露）。见 scripts/check-test-coverage.mjs。
      - name: Test reachability gate
        run: npm run test:coverage

      - name: Bot lap validation
        run: npm run bot

      - name: Build
        run: npm run build

  e2e:
    # M16：Playwright 视觉回归（菜单光晕/标题叠影/天空条纹/热座 HUD/移动端视口）
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E visual regression
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          retention-days: 7
