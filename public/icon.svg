<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OutRun 伪 3D 复刻">
  <!-- 落日天空渐变：橙 → 黄 → 深蓝（OutRun 招牌配色） -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8c1a"/>
      <stop offset="0.5" stop-color="#ffd75e"/>
      <stop offset="0.58" stop-color="#232a40"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2338"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
  </defs>

  <!-- 天空背景 -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- 落日 -->
  <circle cx="256" cy="240" r="70" fill="#fff6d8" opacity="0.95"/>
  <circle cx="256" cy="240" r="56" fill="#ffd75e"/>

  <!-- 路面（透视梯形，汇聚到地平线） -->
  <path d="M118 512 L213 300 L299 300 L394 512 Z" fill="url(#road)"/>

  <!-- 道路两侧黄色边线 -->
  <path d="M132 512 L221 302" stroke="#ffd75e" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>
  <path d="M380 512 L291 302" stroke="#ffd75e" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- 车道中央虚线 -->
  <path d="M256 512 L256 306" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 14" fill="none" opacity="0.9"/>

  <!-- 赛车（俯视，亮黄车身） -->
  <rect x="200" y="338" width="18" height="36" rx="7" fill="#111827"/>
  <rect x="294" y="338" width="18" height="36" rx="7" fill="#111827"/>
  <rect x="200" y="398" width="18" height="36" rx="7" fill="#111827"/>
  <rect x="294" y="398" width="18" height="36" rx="7" fill="#111827"/>
  <rect x="212" y="316" width="88" height="136" rx="20" fill="#ffd75e" stroke="#d9a400" stroke-width="2"/>
  <rect x="226" y="338" width="60" height="42" rx="10" fill="#141a2e"/>
  <rect x="226" y="392" width="60" height="30" rx="8" fill="#0a0e1a"/>
</svg>
