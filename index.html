<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>OutRun 伪 3D 复刻</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="hud-best" hidden>BEST 0:00.000</div>
      <div id="hud-speed">0</div>
      <div id="hud-speed-unit">km/h</div>
      <div id="hud-lap">LAP 1/3</div>
      <div id="hud-time">0:00.000</div>
      <div id="drift-indicator" hidden>DRIFT! +<span id="drift-score-value">0</span></div>
    </div>
    <div id="hud2" hidden>
      <div id="hud-speed-2">0</div>
      <div id="hud-speed-unit-2">km/h</div>
      <div id="hud-lap-2">LAP 1/3</div>
      <div id="hud-time-2">0:00.000</div>
    </div>
    <div id="start-screen">
      <h1>OUTRUN 伪 3D</h1>
      <div id="track-select">
        <div class="track-option selected" id="track-option-0">1 经典赛道</div>
        <div class="track-option" id="track-option-1">2 高速公路</div>
        <div class="track-option" id="track-option-2">3 S 弯挑战</div>
      </div>
      <p id="track-name">经典赛道</p>
      <p id="p2-track-name" hidden>经典赛道</p>
      <p>WASD / 方向键 驾驶</p>
      <p id="touch-hint">触屏：左上刹车 · 右上油门 · 左下左转 · 右下右转</p>
      <p class="hint" id="menu-hint">按任意键开始 · 1/2/3 切换赛道</p>
    </div>
    <div id="finish-screen" hidden>
      <h1>完赛!</h1>
      <p id="finish-time"></p>
      <p id="finish-speed"></p>
      <p id="finish-best"></p>
      <p id="finish-score"></p>
      <div id="finish-laps"></div>
      <p class="hint">按 R 重新开始</p>
    </div>
    <div id="pause-screen" hidden>
      <h1>PAUSED</h1>
      <p class="hint">按 ESC 继续</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
