<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OutRun 伪 3D 复刻</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="hud-best" hidden>BEST 0:00.000</div>
      <div id="hud-speed">0</div>
      <div id="hud-speed-unit">km/h</div>
      <div id="hud-lap">LAP 1/3</div>
      <div id="hud-time">0:00.000</div>
      <div id="drift-indicator" hidden>DRIFT!</div>
    </div>
    <div id="hud2" hidden>
      <div id="hud-speed-2">0</div>
      <div id="hud-speed-unit-2">km/h</div>
      <div id="hud-lap-2">LAP 1/3</div>
      <div id="hud-time-2">0:00.000</div>
    </div>
    <div id="start-screen">
      <h1>OUTRUN 伪 3D</h1>
      <p>WASD / 方向键 驾驶</p>
      <p class="hint">按任意键开始</p>
    </div>
    <div id="finish-screen" hidden>
      <h1>完赛!</h1>
      <p id="finish-time"></p>
      <p id="finish-speed"></p>
      <p id="finish-best"></p>
      <p class="hint">按 R 重新开始</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
